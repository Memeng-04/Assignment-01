<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container text-center mt-5">
    <h1 class="mb-4 text-primary fw-bold">Random User Generator</h1>

    <!-- Controls Box -->
    <div class="d-inline-block p-4 bg-white rounded shadow mb-4">
      <input type="number" id="userCount" placeholder="(0–1000)" min="0" max="1000" class="form-control d-inline-block w-auto me-2">
      <select id="nameOption" class="form-select d-inline-block w-auto me-2">
        <option value="firstN">First Name</option>
        <option value="lastN">Last Name</option>
      </select>
      <button id="generateButton" class="btn btn-primary">Generate</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover align-middle">
        <thead class="table-primary text-center">
          <tr>
            <th>Name</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody id="userTable" class="text-center"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
